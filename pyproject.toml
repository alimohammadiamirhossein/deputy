[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "deputy-cc"
version = "0.3.0"
description = "Claude Code plugin and MCP server that has a cheap model, DeepSeek V4.1 Flash, review Claude's code for bugs and give second opinions, for under a cent each. Claude keeps writing the code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amirhossein Alimohammadi" }]
keywords = [
    "claude-code", "claude", "mcp", "mcp-server", "model-context-protocol", "deepseek",
    "deepseek-v4", "deepinfra", "subagent", "ai-agent", "coding-agent", "llm",
    "cost-optimization", "token-savings", "anthropic", "claude-code-plugin", "agentic-coding",
    "code-review", "ai-code-review", "second-opinion",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.20,<2",
    "openai>=1.40,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deputy = "deputy.cli:main"
deputy-cc = "deputy.cli:main"

[project.urls]
Homepage = "https://github.com/alimohammadiamirhossein/deputy"
Repository = "https://github.com/alimohammadiamirhossein/deputy"
Issues = "https://github.com/alimohammadiamirhossein/deputy/issues"
Changelog = "https://github.com/alimohammadiamirhossein/deputy/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/deputy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
